    <!-- Critical styles for the root-level Shaw STEM Academy loading screen -->
    <style id="initial-loader-styles">
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #initial-loader.initial-loader-fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 360px;
        width: 100%;
        margin: 0 auto;
      }
      .initial-loader-logo-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .initial-loader-glow {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(20, 184, 166, 0.3) 0%, rgba(13, 148, 136, 0) 70%);
        pointer-events: none;
        animation: initialLoaderPulse 2.6s infinite ease-in-out;
      }
      .initial-loader-logo-box {
        position: relative;
        z-index: 10;
        width: 88px;
        height: 88px;
        border-radius: 1.25rem;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(51, 65, 85, 0.6);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        overflow: hidden;
        animation: initialLoaderLogoBreath 2.8s infinite ease-in-out;
      }
      .initial-loader-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .initial-loader-text {
        margin-bottom: 1.25rem;
      }
      .initial-loader-title {
        margin: 0 0 0.25rem 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #f8fafc;
      }
      .initial-loader-subtitle {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #2dd4bf;
        text-transform: uppercase;
      }
      .initial-loader-bar-track {
        width: 220px;
        height: 5px;
        background: rgba(30, 41, 59, 0.9);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(51, 65, 85, 0.6);
        position: relative;
      }
      .initial-loader-bar-fill {
        position: absolute;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #2dd4bf, #3b82f6, #2dd4bf);
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
        animation: initialLoaderProgress 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      .initial-loader-status {
        margin: 0.75rem 0 0 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        color: #94a3b8;
      }
      .initial-loader-error {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 0.75rem;
        max-width: 320px;
      }
      .initial-loader-error-text {
        margin: 0 0 0.5rem 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.75rem;
        color: #fca5a5;
        line-height: 1.4;
      }
      .initial-loader-retry-btn {
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 0.35rem 0.85rem;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .initial-loader-retry-btn:hover {
        background: #1e293b;
      }
      #root.app-root-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #root.app-root-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes initialLoaderPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.35; }
        50% { transform: scale(1.12); opacity: 0.7; }
      }
      @keyframes initialLoaderProgress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @keyframes initialLoaderLogoBreath {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.025); }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader-glow,
        .initial-loader-logo-box,
        .initial-loader-bar-fill {
          animation: none !important;
        }
        #initial-loader,
        #root {
          transition-duration: 0.05s !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Initial Shaw STEM Academy Loading Screen (renders immediately on first paint) -->
    <div id="initial-loader" class="initial-loader-container" aria-label="Loading Shaw STEM Academy" role="status">
      <div class="initial-loader-content">
        <div class="initial-loader-logo-wrapper">
          <div class="initial-loader-glow"></div>
          <div class="initial-loader-logo-box">
            <img
              src="/logo.png"
              alt="Shaw STEM Academy"
              class="initial-loader-logo-img"
              width="88"
              height="88"
              decoding="async"
            />
          </div>
        </div>

        <div class="initial-loader-text">
          <h1 class="initial-loader-title">Shaw STEM Academy</h1>
          <p class="initial-loader-subtitle">Innovate • Explore • Lead</p>
        </div>

        <div class="initial-loader-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div class="initial-loader-bar-fill"></div>
        </div>

        <p id="initial-loader-status" class="initial-loader-status">Initializing Portal...</p>

        <div id="initial-loader-error" class="initial-loader-error" style="display: none;">
          <p id="initial-loader-error-msg" class="initial-loader-error-text">An error occurred while initializing the portal.</p>
          <button type="button" onclick="window.location.reload()" class="initial-loader-retry-btn">Retry Initialization</button>
        </div>
      </div>
    </div>

    <!-- Application Root Container: hidden during initial boot to prevent any FOUC -->
    <div id="root" class="app-root-hidden"></div>

    <noscript>
      <style>
        #initial-loader { display: none !important; }
        #root { opacity: 1 !important; visibility: visible !important; }
      </style>
      <div style="padding: 24px; background: #0f172a; color: #38bdf8; text-align: center; font-family: sans-serif; font-size: 15px;">
        Please enable JavaScript in your browser to experience the Shaw STEM Academy Portal.
      </div>
    </noscript>

    <script>
      window.__appStartTime = performance.now();
      window.__loaderDismissed = false;

      window.dismissInitialLoader = function() {
        if (window.__loaderDismissed) return;
        window.__loaderDismissed = true;

        var elapsed = performance.now() - (window.__appStartTime || 0);
        // Ensure at least 350ms so instant local caches don't cause an imperceptible jarring flash
        var delay = Math.max(0, 350 - elapsed);

        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          var root = document.getElementById('root');
          if (root) {
            root.classList.remove('app-root-hidden');
            root.classList.add('app-root-visible');
          }
          if (loader) {
            loader.classList.add('initial-loader-fade-out');
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 450);
          }
        }, delay);
      };

      window.showInitialLoaderError = function(message) {
        if (window.__loaderDismissed) return;
        var status = document.getElementById('initial-loader-status');
        var bar = document.querySelector('.initial-loader-bar-track');
        var errBox = document.getElementById('initial-loader-error');
        var errMsg = document.getElementById('initial-loader-error-msg');
        if (bar) bar.style.display = 'none';
        if (status) status.style.display = 'none';
        if (errMsg && message) errMsg.textContent = message;
        if (errBox) errBox.style.display = 'block';
      };

      // Watchdog timer: If initialization takes abnormally long, show error with retry
      setTimeout(function() {
        if (!window.__loaderDismissed) {
          window.showInitialLoaderError('The portal is taking longer than expected to load. Please check your network connection or tap retry.');
        }
      }, 10000);

      window.addEventListener('error', function(e) {
        if (!window.__loaderDismissed) {
          window.showInitialLoaderError('Unable to initialize portal (' + (e.message || 'Script error') + ').');
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.toString().toLowerCase().includes('websocket')) return;
        if (!window.__loaderDismissed) {
          window.showInitialLoaderError('Failed to complete initialization: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
