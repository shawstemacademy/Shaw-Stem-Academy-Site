<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Shaw STEM Academy</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }
      .container {
        text-align: center;
        max-width: 440px;
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 24px;
        padding: 40px 30px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
      }
      .logo {
        width: 100px;
        height: 100px;
        object-fit: contain;
        margin-bottom: 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 12px 0;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin: 0 0 24px 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        text-decoration: none;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      }
      .btn:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img 
        src="/logo.png" 
        alt="Shaw STEM Academy Logo" 
        class="logo" 
      />
      <div class="badge">
        <span>No Internet Connection</span>
      </div>
      <h1>You are Offline</h1>
      <p>
        We can't connect to the Shaw STEM Academy servers right now. Please check your internet connection or Wi-Fi settings and try again.
      </p>
      <button class="btn" onclick="window.location.reload();">
        Retry Connection
      </button>
    </div>
  </body>
</html>
